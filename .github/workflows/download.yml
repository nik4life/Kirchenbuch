name: Kirchenbuch PDF
run-name: Kirchenbuch ${{ inputs.band }}
on:
  workflow_dispatch:
    inputs:
      band:
        description: Band
        required: true
        type: choice
        options: ["918","919","920","921","all"]
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      - name: Digitalisate laden und PDF erstellen
        run: python kirchenbuch.py "${{ inputs.band }}" --output output
      - name: Ergebnis speichern
        uses: actions/upload-artifact@v4
        with:
          name: kirchenbuch-${{ inputs.band }}
          path: output/*.pdf
          if-no-files-found: error
          retention-days: 30
